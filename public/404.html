<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khmer Teacher Lesson Plan AI</title>
    <script>
      // Single Page Apps for GitHub Pages redirect
      sessionStorage.redirect = location.href;
      var pathSegments = location.pathname.split('/').filter(Boolean);
      var targetPath = '/';
      if (pathSegments.length > 0) {
        if (pathSegments[1] === 'docs') {
          targetPath = '/' + pathSegments[0] + '/docs/';
        } else {
          targetPath = '/' + pathSegments[0] + '/';
        }
      }
      location.replace(targetPath);
    </script>
  </head>
