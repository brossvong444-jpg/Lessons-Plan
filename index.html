    <script>
      // Single Page App redirect restoration for GitHub Pages
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();

      // Ensure trailing slash for GitHub Pages repo URLs so relative assets resolve correctly
      (function(){
        if (location.hostname.endsWith('github.io')) {
          var p = location.pathname;
          if (p.length > 1 && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
            location.replace(p + '/' + location.search + location.hash);
          }
        }
      })();
    </script>
